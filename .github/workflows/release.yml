name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
          - os: macos-latest
            type: dmg
          - os: windows-latest
            type: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install wixtoolset --no-progress --yes
          "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_PACKAGE_IDENTIFIER: ${{ secrets.MACOS_PACKAGE_IDENTIFIER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for value in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD MACOS_SIGNING_IDENTITY MACOS_PACKAGE_IDENTIFIER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!value}" || { echo "Missing required release secret: $value" >&2; exit 1; }
          done
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/devforge-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/devforge-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Validate Windows signing configuration
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          @("WINDOWS_SIGNING_CERTIFICATE", "WINDOWS_SIGNING_CERTIFICATE_PASSWORD", "WINDOWS_TIMESTAMP_URL") | ForEach-Object {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))) { throw "Missing required release secret: $_" }
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\devforge-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          JPACKAGE_MAC_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          JPACKAGE_MAC_PACKAGE_IDENTIFIER: ${{ secrets.MACOS_PACKAGE_IDENTIFIER }}
        run: scripts/package.sh ${{ matrix.type }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: powershell -File scripts/package.ps1 -Type ${{ matrix.type }}
      - name: Notarize and staple macOS package
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PACKAGE="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$PACKAGE"
          xcrun notarytool submit "$PACKAGE" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$PACKAGE"
          xcrun stapler validate "$PACKAGE"
      - name: Authenticode-sign Windows package
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $package = Get-ChildItem dist -Recurse -Filter *.exe | Select-Object -First 1
          if ($null -eq $package) { throw "The Windows installer was not produced." }
          & signtool.exe sign /f "$env:RUNNER_TEMP\devforge-signing.pfx" /p "$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD" /fd SHA256 /tr "$env:WINDOWS_TIMESTAMP_URL" /td SHA256 $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          & signtool.exe verify /pa /all $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }
      - name: Create Linux checksums
        if: runner.os == 'Linux'
        run: cd dist && sha256sum * > SHA256SUMS-linux
      - name: Create macOS checksums
        if: runner.os == 'macOS'
        run: cd dist && shasum -a 256 * > SHA256SUMS-macos
      - name: Create Windows checksums
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devforge-${{ matrix.os }}
          path: dist/*
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
