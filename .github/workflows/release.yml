name: Release
on:
  push:
    tags: ['v*']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
          - os: macos-latest
            type: dmg
          - os: windows-latest
            type: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/package.sh ${{ matrix.type }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: powershell -File scripts\package.ps1 -Type ${{ matrix.type }}
      - uses: actions/upload-artifact@v4
        with:
          name: devforge-${{ matrix.os }}
          path: dist/*
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
