name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B clean verify
      - name: Smoke test the shaded jar (SQLite native library, migrations, CLI)
        shell: bash
        run: |
          export DEVFORGE_HOME="$RUNNER_TEMP/devforge-smoke"
          JAR=$(ls target/devforge-*.jar | grep -v original | head -n1)
          java -jar "$JAR" --version
          java -jar "$JAR" status --json
          mkdir -p "$RUNNER_TEMP/smoke-project" && cd "$RUNNER_TEMP/smoke-project" && echo "hello smoke" > a.txt
          java -jar "$GITHUB_WORKSPACE/$JAR" init .
          java -jar "$GITHUB_WORKSPACE/$JAR" search index .
          java -jar "$GITHUB_WORKSPACE/$JAR" search smoke
      - name: Build native app image
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -File scripts/package.ps1 -Type app-image
          else
            scripts/package.sh app-image
          fi
      - name: Smoke test native app image
        shell: bash
        run: |
          export DEVFORGE_HOME="$RUNNER_TEMP/devforge-native-smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            LAUNCHER="$(find dist -iname 'devforge.exe' -print -quit)"
          else
            LAUNCHER="$(find dist -path '*/bin/devforge' -type f -print -quit)"
          fi
          test -n "$LAUNCHER" || { echo "Native launcher was not produced" >&2; exit 1; }
          "$LAUNCHER" status --json
